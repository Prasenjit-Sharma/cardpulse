# The Pulse API on the Pulse Cloudflare account (pulsecardscanner@gmail.com), one Worker per environment:
#   dev      pulse-api-dev      https://api-dev.pulsecardscanner.com      database pulse-test   app in.pulsecardscanner.app.dev
#   staging  pulse-api-staging  https://api-staging.pulsecardscanner.com  database pulse-test   app in.pulsecardscanner.app.staging
#   prod     pulse-api          https://api.pulsecardscanner.com          database pulse-prod   app in.pulsecardscanner.app
# Always deploy with an environment, through the project token (never `wrangler login` on this Mac):
#   npm run cf -- deploy --env dev        (scripts/cf.sh reads the token from the Keychain for that one command)
# Secrets, per environment (never committed): GEMINI_API_KEY, from the Keychain item cardpulse-gemini-test (dev, staging)
# or cardpulse-gemini-prod (prod):  npm run cf:secrets
# Wrangler does not pass [vars], KV or routes down to environments, so each environment lists its own below; keep the
# model settings the same in all three unless a test says otherwise.
#
# Models (the same in every environment):
# - GEMINI_MODEL reads cards. Reading test 2026-10-10: 3.5 Flash-Lite 83 to 91% (about ₹0.114 a card); 2.5 models are
#   closed to new users. GEMINI_FALLBACK_MODEL is tried once when it answers 429, 500, 503 or 504; 3.1 Flash-Lite read
#   79%, so a fallback only. It shuts down on 7 May 2027: replace it before.
# - BRIEF_MODEL makes Pulse Briefs with Google Search (BRIEF_SEARCH = "1"). 2026-10-10: Google retired 3.5 Flash; 3.6 Flash
#   with the Worker's nudge searched 3 of 4 contacts, like 3.5, at about ₹0.16 to 0.18 a brief before search fees
#   (promotional price, doubling on 1 January 2027). BRIEF_THINKING "minimal": the same facts as "low" at 2.7x the speed.
# - BRIEF_CACHE: company research shared between briefs at the same company for 30 days (7 when nothing was found).
#   Nothing about a person is kept. One namespace per environment.

name = "pulse-api"
main = "worker.ts"
compatibility_date = "2025-09-01"
account_id = "caf6401c7e28c7eb7044a283ea5e96dd"

# Keep the Worker's log lines (reads, briefs, charges, Gemini usage) for a few days in the dashboard (Workers → Logs).
[observability]
enabled = true
head_sampling_rate = 1

[env.dev]
name = "pulse-api-dev"
routes = [{ pattern = "api-dev.pulsecardscanner.com", custom_domain = true }]
kv_namespaces = [{ binding = "BRIEF_CACHE", id = "629345f43e2c42cda5a4ebc7d95ff434" }]
[env.dev.vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_FALLBACK_MODEL = "gemini-3.1-flash-lite"
BRIEF_SEARCH = "1"
BRIEF_MODEL = "gemini-3.6-flash"
BRIEF_THINKING = "minimal"
# the app (Capacitor serves it from https://localhost) and this environment's website
ALLOWED_ORIGINS = "https://localhost,https://dev.pulsecardscanner.com"
SUPABASE_URL = "https://efhhwamvfgcjgbpwfnuy.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_QnRfHJSXzqXH5r2paLxE6A_ZemmJpsi"

[env.staging]
name = "pulse-api-staging"
routes = [{ pattern = "api-staging.pulsecardscanner.com", custom_domain = true }]
kv_namespaces = [{ binding = "BRIEF_CACHE", id = "1371c1cc2c9c42379117dac43ccd6e29" }]
[env.staging.vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_FALLBACK_MODEL = "gemini-3.1-flash-lite"
BRIEF_SEARCH = "1"
BRIEF_MODEL = "gemini-3.6-flash"
BRIEF_THINKING = "minimal"
ALLOWED_ORIGINS = "https://localhost,https://staging.pulsecardscanner.com"
SUPABASE_URL = "https://efhhwamvfgcjgbpwfnuy.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_QnRfHJSXzqXH5r2paLxE6A_ZemmJpsi"

[env.prod]
name = "pulse-api"
routes = [{ pattern = "api.pulsecardscanner.com", custom_domain = true }]
kv_namespaces = [{ binding = "BRIEF_CACHE", id = "3694ed101dc448a496987e77676477fc" }]
[env.prod.vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_FALLBACK_MODEL = "gemini-3.1-flash-lite"
BRIEF_SEARCH = "1"
BRIEF_MODEL = "gemini-3.6-flash"
BRIEF_THINKING = "minimal"
ALLOWED_ORIGINS = "https://localhost,https://pulsecardscanner.com,https://www.pulsecardscanner.com"
SUPABASE_URL = "https://suhlynnoeatjnrokaaox.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_w9PvGhjwDyhlquaeGyaC-w_wtwxcgNa"
