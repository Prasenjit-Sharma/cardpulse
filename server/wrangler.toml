name = "cardpulse-api"
main = "worker.ts"
compatibility_date = "2025-09-01"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Tried once when GEMINI_MODEL is overloaded or failing (429, 500, 503, 504). Reading test 2026-10-10: 3.1 Flash-Lite read
# 79% against 3.5 Flash-Lite's 83 to 91%, so a fallback only, not a replacement. It shuts down on 7 May 2027: replace it before.
GEMINI_FALLBACK_MODEL = "gemini-3.1-flash-lite"
# Pulse Brief. By default Gemini writes it from what it already knows (works on a free key). To switch on Google
# Search later: put a PAID project's key in a second secret, so card reading stays on the free key, and set the flag:
#   npx wrangler secret put BRIEF_API_KEY
#   BRIEF_SEARCH = "1"
# A free key has no Search grounding allowance (every search was 429 RESOURCE_EXHAUSTED, 29 Sept).
# On since 29 Sept: BRIEF_API_KEY holds the paid project's key. Remove this line to go back to briefs without search.
BRIEF_SEARCH = "1"
# With search, flash-lite mostly answered from memory (searched 1 time in 4); gemini-3.5-flash with low thinking
# searched 2 in 3 at 9 to 13 s (with default thinking it took 30 to 40 s). Without it, GEMINI_MODEL is used.
# 2026-10-10: Google retired gemini-3.5-flash and serves 3.6 Flash in its place; named directly, as Google advises. Brief lab
# (4 contacts, two runs, with the Worker's nudge): searched 3 of 4 both times, like 3.5; about ₹0.16 to 0.18 a brief
# before search fees against ₹0.32 (promotional price, doubling on 1 January 2027). It accepts "minimal" thinking.
BRIEF_MODEL = "gemini-3.6-flash"
# Brief lab, 6 Oct (4 real contacts): minimal thinking gave the same facts as low at 2.7x the speed (8 s, not 21 s) and a
# sixth of the model cost (about ₹0.44, not ₹2.80); capping searches in the prompt made the model skip searching, so not done.
BRIEF_THINKING = "minimal"
# Exact origins allowed to call the API. Add your own domain here if you use one.
ALLOWED_ORIGINS = "https://prasenjit-sharma.github.io,https://localhost"
# Accounts and balances (migration 0005's begin_read / charge_reads / begin_brief / charge_brief), called with each
# user's own token. With these set, reading a card needs sign-in. Both values are public: they are the same ones the app
# ships with. Remove them to go back to signed-out reading under the per-IP limit only.
SUPABASE_URL = "https://xqwslvteyhfmnxcnlpsg.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_xRiJzrH9yCIo_NwHN1jNDw_zWfTAiqf"

# Secret (never commit it):  npx wrangler secret put GEMINI_API_KEY

# Company research shared between Pulse Briefs at the same company, from any account, for 30 days (7 when nothing was
# found). Matched by GSTIN, or by the company's own domain or its name with pincode, the name checked too. Nothing
# about a person is kept. Only this Worker can read or write it.
[[kv_namespaces]]
binding = "BRIEF_CACHE"
id = "5849e39034954c78a9424d72ce987051"

# Keep the Worker's log lines (reads, briefs, charges, Gemini usage) for a few days, so they can be read after the fact
# in the Cloudflare dashboard (Workers → cardpulse-api → Logs), not only live with `wrangler tail`.
[observability]
enabled = true
head_sampling_rate = 1
